name: Windows CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  build:
    name: Verify Windows package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build development bundles
        run: npm run build-dev

      - name: Run unit tests
        run: npm run test:unit

      - name: Run export and project tests
        run: npm run test:export-project

      - name: Build unpacked Windows package
        run: npm run dist-preview

      - name: Upload unpacked app
        uses: actions/upload-artifact@v7
        with:
          name: fSpy-UE-win-unpacked
          path: dist/win-unpacked
          if-no-files-found: error
